  <body>
    <div id="root">
      <!-- Shown only before React mounts (or if JS fails). Navy field, logo, one line. -->
      <div style="min-height:100vh;display:grid;place-items:center;background:#061428;font-family:system-ui,-apple-system,sans-serif;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px;">
          <img src="/Empathon logo.png" alt="Empathon Autos" width="232" style="width:232px;height:auto;display:block;" />
          <span style="display:block;width:168px;height:2px;background:rgba(255,255,255,0.14);overflow:hidden;">
            <span style="display:block;width:44%;height:100%;background:rgba(255,255,255,0.85);animation:ea-load 1.15s ease-in-out infinite;"></span>
          </span>
        </div>
      </div>
      <style>
        @keyframes ea-load {
          0% { transform: translateX(-110%); }
          100% { transform: translateX(340%); }
        }
        @media (prefers-reduced-motion: reduce) {
          #root [style*="ea-load"] { animation: none !important; width: 100% !important; }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
