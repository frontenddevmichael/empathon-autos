<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#003366" stop-opacity="0"/>
      <stop offset="50%" stop-color="#003366" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#003366" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4c4c4"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
  </defs>
  <!-- Animated road lines -->
  <g>
    <line x1="0" y1="520" x2="800" y2="520" stroke="rgba(208,208,208,0.08)" stroke-width="1" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="540" x2="800" y2="540" stroke="rgba(208,208,208,0.12)" stroke-width="1" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="560" x2="800" y2="560" stroke="rgba(208,208,208,0.06)" stroke-width="1" stroke-dasharray="4 12">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- Main car silhouette -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0; -4,-2; 0,0; 4,-1; 0,0" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1"/>
    <path d="M 120 420 Q 100 420 100 400 Q 100 370 130 370 Q 150 340 180 330 Q 210 320 260 320 Q 310 320 350 340 Q 390 350 420 370 Q 440 380 440 400 Q 440 420 410 420 L 120 420 Z" fill="rgba(0,51,102,0.04)" stroke="url(#carGrad)" stroke-width="1.5" opacity="0.3"/>
    <path d="M 130 415 Q 108 415 108 395 Q 108 365 135 365 Q 155 335 185 325 Q 215 315 265 315 Q 315 315 355 335 Q 395 345 425 365 Q 445 375 445 395 Q 445 415 415 415 L 130 415 Z" fill="rgba(208,208,208,0.04)" stroke="rgba(208,208,208,0.15)" stroke-width="0.8"/>
    <!-- Windows -->
    <path d="M 180 340 L 240 335 L 240 375 L 180 375 Z" fill="rgba(0,51,102,0.06)"/>
    <path d="M 255 335 L 330 340 L 330 375 L 255 375 Z" fill="rgba(0,51,102,0.06)"/>
    <!-- Wheels -->
    <circle cx="195" cy="435" r="28" fill="none" stroke="rgba(0,51,102,0.12)" stroke-width="1.5">
      <animate attributeName="r" values="28;28.5;28" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="195" cy="435" r="22" fill="none" stroke="rgba(208,208,208,0.08)" stroke-width="0.8"/>
    <circle cx="195" cy="435" r="8" fill="rgba(0,51,102,0.06)">
      <animate attributeName="r" values="8;8.5;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="435" r="28" fill="none" stroke="rgba(0,51,102,0.12)" stroke-width="1.5">
      <animate attributeName="r" values="28;28.5;28" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="435" r="22" fill="none" stroke="rgba(208,208,208,0.08)" stroke-width="0.8"/>
    <circle cx="380" cy="435" r="8" fill="rgba(0,51,102,0.06)">
      <animate attributeName="r" values="8;8.5;8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <!-- Floating decorative circles -->
  <circle cx="650" cy="160" r="40" fill="none" stroke="rgba(208,208,208,0.06)" stroke-width="1" stroke-dasharray="3 5">
    <animate attributeName="r" values="40;44;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="160" r="28" fill="none" stroke="rgba(208,208,208,0.04)" stroke-width="0.6"/>
  <!-- Small floating dots -->
  <circle cx="580" cy="280" r="3" fill="rgba(208,208,208,0.15)">
    <animate attributeName="cy" values="280;270;280" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.3;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="320" r="2" fill="rgba(0,51,102,0.12)">
    <animate attributeName="cy" values="320;308;320" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="380" r="4" fill="rgba(208,208,208,0.08)">
    <animate attributeName="cy" values="380;370;380" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="200" r="2" fill="rgba(0,51,102,0.1)">
    <animate attributeName="cy" values="200;190;200" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="300" r="3" fill="rgba(208,208,208,0.1)">
    <animate attributeName="cy" values="300;292;300" dur="4s" repeatCount="indefinite"/>
  </circle>
  <!-- Steering wheel decorative icon -->
  <g transform="translate(680, 480)" opacity="0.05">
    <circle cx="0" cy="0" r="30" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="0" y2="-28" stroke="currentColor" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="24" y2="-14" stroke="currentColor" stroke-width="0.6"/>
    <line x1="0" y1="0" x2="24" y2="14" stroke="currentColor" stroke-width="0.6"/>
    <animateTransform attributeName="transform" type="rotate" from="0 680 480" to="360 680 480" dur="20s" repeatCount="indefinite"/>
  </g>
  <!-- Shield decorative icon -->
  <g transform="translate(120, 160)" opacity="0.04">
    <path d="M 0 -20 L 15 -10 L 15 5 C 15 15 5 22 0 24 C -5 22 -15 15 -15 5 L -15 -10 Z" fill="none" stroke="currentColor" stroke-width="0.8"/>
    <path d="M -5 5 L 0 10 L 7 2" stroke="currentColor" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Speed lines behind car -->
  <g opacity="0.04">
    <line x1="60" y1="420" x2="100" y2="420" stroke="rgba(208,208,208,0.3)" stroke-width="1"/>
    <line x1="30" y1="440" x2="90" y2="440" stroke="rgba(208,208,208,0.2)" stroke-width="0.8"/>
    <line x1="50" y1="460" x2="95" y2="460" stroke="rgba(208,208,208,0.15)" stroke-width="0.6"/>
  </g>
</svg>